<link href="/common/css/common/Bbs.css" rel="stylesheet">

<article id="bbsLayoutGalleryPage" class="gi-gallery-board gi-row-100 gi-col-100">
    <section class="gi-gallery-shell">
        <header class="gi-gallery-toolbar">
            <div class="gi-gallery-total">
                <span>전체 게시물</span>
                <b id="gallery-total-count">0</b>
            </div>
        </header>

        <section class="gi-gallery-search-area">
            <input id="gallery-search-input" type="text" placeholder="제목" autocomplete="off">
            <button id="gallery-search-btn" class="gi-gallery-search-btn" type="button">조회</button>
            <button id="gallery-reset-btn" class="gi-gallery-reset-btn" type="button">초기화</button>
            <div class="gi-gallery-sort-tabs" role="group" aria-label="게시물 정렬">
                <button type="button" class="active" data-gallery-sort="latest">최신순</button>
                <button type="button" data-gallery-sort="views">조회순</button>
            </div>
            <div class="gi-gallery-view-tabs" role="group" aria-label="보기 방식">
                <button type="button" class="active" data-gallery-view="grid" aria-label="카드 보기">
                    <i class="fa-solid fa-grip"></i>
                </button>
                <button type="button" data-gallery-view="list" aria-label="리스트 보기">
                    <i class="fa-solid fa-list"></i>
                </button>
            </div>
        </section>

        <div id="gallery-card-container" class="gi-gallery-grid">
        </div>

        <footer class="gi-gallery-footer-actions">
            <div aria-hidden="true"></div>
            <nav id="gallery-pagination" class="gi-gallery-pagination" aria-label="게시물 페이지">
            </nav>
            <div class="gi-gallery-bottom-actions">
                <button id="bbs-gallery-write-btn" class="gi-gallery-write-btn" type="button">
                    <span>[Page.Message].Message.Label.Array["WRITE_BTN"]</span>
                </button>
            </div>
        </footer>
    </section>
</article>

<script type="text/javascript">
    var bbsSessionData = JSON.parse(sessionStorage.getItem("DATA"));
    var bbsId = bbsSessionData ? bbsSessionData.bbs_id : 'default_id';
    var bbsNm = bbsSessionData ? bbsSessionData.bbs_nm : Message.Label.Array["GALLERY"];
    var galleryState = {
        page: 1,
        range: 10,
        sort: "latest",
        sortId: "sys_crt_dt",
        sortOrder: "DESC",
        view: "grid",
        data: []
    };

    init();

    function init() {
        new PageInit();
        findByGalleryList(1);
        clickEvent();
    }

    function clickEvent() {
        $("#bbs-gallery-write-btn").off("click").on("click", function () {
            formUtil.apiLoadContent("cms", "/bbs/sysBbsBoardWrite", { bbs_id: bbsId });
        });

        $("#gallery-search-btn").off("click").on("click", function () {
            findByGalleryList(1);
        });

        $("#gallery-reset-btn").off("click").on("click", function () {
            $("#gallery-search-input").val("");
            findByGalleryList(1);
        });

        $("#gallery-search-input").off("keypress").on("keypress", function (e) {
            if (e.which === 13) {
                findByGalleryList(1);
            }
        });

        $("[data-gallery-sort]").off("click").on("click", function () {
            let sortType = $(this).data("gallery-sort");

            $("[data-gallery-sort]").removeClass("active");
            $(this).addClass("active");

            galleryState.sort = sortType;
            galleryState.sortId = sortType === "views" ? "inq_cnt" : "sys_crt_dt";
            galleryState.sortOrder = "DESC";
            findByGalleryList(1);
        });

        $("[data-gallery-view]").off("click").on("click", function () {
            let viewType = $(this).data("gallery-view");

            $("[data-gallery-view]").removeClass("active");
            $(this).addClass("active");

            galleryState.view = viewType;
            $("#gallery-card-container")
                .toggleClass("gi-gallery-list", viewType === "list")
                .toggleClass("gi-gallery-grid", viewType === "grid");

            renderGalleryItems(galleryState.data);
        });
    }

    async function findByGalleryList(page) {
        galleryState.page = page || 1;

        let url = "/cms/common/sysBbsBoard/findPage";
        let param = {
            bbs_id: bbsId,
            page_no: galleryState.page,
            row_range: galleryState.range,
            offset: (galleryState.page - 1) * galleryState.range,
            sort_id: galleryState.sortId,
            sort_order: galleryState.sortOrder
        };

        let searchInput = $("#gallery-search-input").val();
        if (searchInput) {
            param._ttl = searchInput;
        }

        try {
            const response = await axios.post(url, param);
            if (response.status === 200) {
                let data = response.data.DATA || [];
                let totalCount = response.data.TOTAL_COUNT ? response.data.TOTAL_COUNT[0] : 0;
                let totalPages = response.data.TOTAL_PAGING ? response.data.TOTAL_PAGING[0] : 0;

                galleryState.data = data;
                $("#gallery-total-count").text(totalCount);
                renderGalleryItems(data);
                renderPagination(totalPages, galleryState.page);
            }
        } catch (error) {
            console.error("Failed to fetch gallery list", error);
        }
    }

    function renderGalleryItems(data) {
        const container = $("#gallery-card-container");
        container.empty();

        if (!data || data.length === 0) {
            container.html(
                '<div class="gi-gallery-empty">' +
                '<i class="fa-regular fa-image"></i>' +
                '<strong>' + getMessage("FAIL.SELECT_NO_DATA", "게시물이 없습니다.") + '</strong>' +
                '</div>'
            );
            return;
        }

        if (galleryState.view === "list") {
            container.append(`
                <div class="gi-gallery-list-header">
                    <span>미리보기</span>
                    <span>게시물 정보</span>
                    <span>작성자 · 등록일</span>
                    <span>조회 · 댓글</span>
                </div>
            `);
        }

        data.forEach(function (item, index) {
            let itemHtml = galleryState.view === "list"
                ? createGalleryListItem(item, index)
                : createGalleryCardItem(item, index);

            let $item = $(itemHtml);
            $item.on("click", function () {
                formUtil.apiLoadContent("cms", "/bbs/sysBbsBoardDetail", { pst_id: item.pst_id, bbs_id: bbsId });
            });

            container.append($item);
        });
    }

    function createGalleryCardItem(item, index) {
        let summary = getGallerySummary(item);
        let writer = escapeHtml(item.wrtr_nm || getMessage("UNKNOWN", "작성자"));
        let date = formatDate(item.sys_crt_dt);
        let title = escapeHtml(item.ttl || getMessage("NO_TITLE", "제목 없음"));
        let content = escapeHtml(summary);

        return `
            <article class="gi-gallery-card" data-pst-id="${escapeHtml(item.pst_id || '')}">
                ${createGalleryPreview(item, index)}
                <div class="gi-gallery-card-body">
                    <h2>${title}</h2>
                    <p>${content}</p>
                    <div class="gi-gallery-card-footer">
                        <div class="gi-gallery-author">
                            <span>${getWriterInitial(writer)}</span>
                            <div>
                                <strong>${writer}</strong>
                                <time datetime="${date}">${date}</time>
                            </div>
                        </div>
                        <div class="gi-gallery-meta">
                            <span><i class="fa-regular fa-eye"></i>${item.inq_cnt || 0}</span>
                            <span><i class="fa-regular fa-comment"></i>${item.reply_count || 0}</span>
                        </div>
                    </div>
                </div>
            </article>
        `;
    }

    function createGalleryListItem(item, index) {
        let summary = getGallerySummary(item);
        let writer = escapeHtml(item.wrtr_nm || getMessage("UNKNOWN", "작성자"));
        let date = formatDate(item.sys_crt_dt);
        let title = escapeHtml(item.ttl || getMessage("NO_TITLE", "제목 없음"));
        let content = escapeHtml(summary);

        return `
            <article class="gi-gallery-list-item" data-pst-id="${escapeHtml(item.pst_id || '')}">
                ${createGalleryPreview(item, index)}
                <div class="gi-gallery-list-body">
                    <h2>${title}</h2>
                    <p>${content}</p>
                </div>
                <div class="gi-gallery-list-author">
                    <div class="gi-gallery-author">
                        <span>${getWriterInitial(writer)}</span>
                        <div>
                            <strong>${writer}</strong>
                            <time datetime="${date}">${date}</time>
                        </div>
                    </div>
                </div>
                <div class="gi-gallery-meta">
                    <span><i class="fa-regular fa-eye"></i>${item.inq_cnt || 0}</span>
                    <span><i class="fa-regular fa-comment"></i>${item.reply_count || 0}</span>
                </div>
            </article>
        `;
    }

    function createGalleryPreview(item, index) {
        let title = escapeHtml(item.ttl || getMessage("NO_TITLE", "제목 없음"));

        if (item.thmb_path) {
            let imgSrc = "/fms/fileManager/previewByUuid?fileUuid=" + encodeURIComponent(item.thmb_path);
            return `
                <div class="gi-gallery-preview has-image">
                    <img src="${imgSrc}" alt="${title}" onerror="this.closest('.gi-gallery-preview').outerHTML = createGalleryFallbackPreview();">
                </div>
            `;
        }

        return createGalleryFallbackPreview();
    }

    function createGalleryFallbackPreview() {
        let label = getMessage("SYS_BBS_BRD.NO_THMBNL", "썸네일 없음");

        return `
            <div class="gi-gallery-preview no-thumbnail">
                <span class="gi-gallery-no-thmbnl-badge">${escapeHtml(label)}</span>
            </div>
        `;
    }

    function renderPagination(totalPages, currentPage) {
        const container = $("#gallery-pagination");
        container.empty();

        if (!totalPages || totalPages <= 1) return;

        const maxVisible = 10;
        let start = Math.floor((currentPage - 1) / maxVisible) * maxVisible + 1;
        let end = Math.min(totalPages, start + maxVisible - 1);

        for (let i = start; i <= end; i++) {
            container.append(createPageButton(i, i, false, i === currentPage));
        }
    }

    function createPageButton(label, page, disabled, active) {
        let $button = $(`<button type="button" class="gi-gallery-page-btn ${active ? 'active' : ''}" ${disabled ? 'disabled' : ''}>${label}</button>`);

        if (!disabled) {
            $button.on("click", function () {
                findByGalleryList(page);
            });
        }

        return $button;
    }

    function getGallerySummary(item) {
        let text = stripHtml(item.cn || "");
        if (!text) return "게시물 내용을 확인해 주세요.";
        return text.length > 70 ? text.substring(0, 70) + "..." : text;
    }

    function getWriterInitial(writer) {
        let value = stripHtml(writer || "GO").trim();
        if (!value) return "GO";
        return value.substring(0, 2).toUpperCase();
    }

    function getMessage(key, fallback) {
        return typeof Message !== "undefined" && Message.Label && Message.Label.Array[key] ? Message.Label.Array[key] : fallback;
    }

    function stripHtml(html) {
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || "";
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
        if (!dateStr) return "-";
        return String(dateStr).substring(0, 10);
    }
</script>
