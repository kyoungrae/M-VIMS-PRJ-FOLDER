<article class="gi-article-content gi-col-95 gi-row-100">
    <section class="gi-col-100 gi-row-100">
        <header class="gi-flex gi-flex-center gi-col-10">
            <h1 class="gi-page-title">사용자 등록 신청</h1>
        </header>
        <article class="gi-col-90 gi-row-100">
            <!-- 검색 영역 -->
            <div id="search-area"
                class="gi-flex gi-flex-align-items-center gi-grid-gap-16px gi-margin-bottom-16px">
                <div class="gi-input-container" style="width: 180px;">
                    <label for="search_stat_cd" class="gi-input-label" data-focus-label="true">상태</label>
                    <input gi-selectbox data-selectbox-field="SYS_USER_REG_STATUS" class="gi-input" id="search_stat_cd"
                        name="search_stat_cd" autocomplete="off" />
                </div>
                <div class="gi-input-container gi-flex-1">
                    <label for="search_kw" class="gi-input-label" data-focus-label="true">아이디 / 이름</label>
                    <input class="gi-input" type="text" id="search_kw" name="search_kw" autocomplete="off" />
                </div>
                <div class="gi-flex gi-grid-gap-10px">
                    <button id="search-btn" class="gi-btn-blue" type="button">조회</button>
                    <button id="reset-btn" class="gi-btn" type="button">초기화</button>
                </div>
            </div>

            <div id="gi-Grid" class="gi-Grid" style="height: 560px;"></div>

            <div class="gi-flex gi-flex-justify-content-flex-end gi-margin-top-12px">
                <button id="req-register-btn" class="gi-btn-blue" type="button"
                    style="min-width: 150px; padding: 0 24px; white-space: nowrap;">사용자 등록 신청</button>
            </div>
        </article>
    </section>
</article>

<!-- 사용자 등록 신청 팝업 -->
<article id="userReqEdit_gi-popup" class="gi-popup" data-popup-open="false">
    <div class="gi-popup-body" style="width: 460px;">
        <div class="gi-popup-header"><span id="userReq-popup-title">신청서 작성</span></div>
        <div class="gi-popup-contents">
            <form id="sysUserReqForm">
                <div class="gi-flex gi-flex-column gi-grid-gap-16px">
                    <div class="gi-input-container">
                        <label for="req_user_id" class="gi-input-label" data-focus-label="true"
                            data-required="true">아이디</label>
                        <input data-field="user_id" id="req_user_id" name="user_id" class="gi-input"
                            data-required="true" autocomplete="off" />
                    </div>
                    <div class="gi-input-container">
                        <label for="req_eml" class="gi-input-label" data-focus-label="true"
                            data-required="true">이메일</label>
                        <input data-field="eml" id="req_eml" name="eml" class="gi-input" data-required="true"
                            autocomplete="off" />
                    </div>
                    <div class="gi-input-container">
                        <label for="req_fnm" class="gi-input-label" data-focus-label="true">이름</label>
                        <input data-field="fnm" id="req_fnm" name="fnm" class="gi-input" autocomplete="off" />
                    </div>
                    <div class="gi-input-container">
                        <label for="req_telno" class="gi-input-label" data-focus-label="true">전화번호</label>
                        <input data-field="telno" id="req_telno" name="telno" class="gi-input" autocomplete="off" />
                    </div>
                    <div class="gi-input-container">
                        <label for="req_role" class="gi-input-label" data-focus-label="true">권한</label>
                        <input data-field="role" id="req_role" name="role" class="gi-input" autocomplete="off"
                            placeholder="USER" />
                    </div>
                    <div class="gi-input-container">
                        <label for="req_req_rsn" class="gi-input-label" data-focus-label="true">신청 사유</label>
                        <input data-field="req_rsn" id="req_req_rsn" name="req_rsn" class="gi-input"
                            autocomplete="off" />
                    </div>
                </div>
            </form>
        </div>
        <div class="gi-popup-footer">
            <button id="req-save-btn" class="gi-btn-blue" type="button">저장</button>
            <button class="gi-popup-close-btn" type="button">닫기</button>
        </div>
    </div>
</article>

<script type="text/javascript">
    var PRGMID = "sysUserReqList";
    var EDIT_POPUPID = "userReqEdit_gi-popup";
    var currentReqId = null; // null = 신규 작성, 값 있으면 수정

    init();

    function init() {
        new PageInit();
        findList();
        setTimeout(clickEvent);
    }

    function clickEvent() {
        $("#search-btn").off("click").on("click", findList);
        $("#reset-btn").off("click").on("click", function () {
            $("#search_stat_cd").val("");
            $("#search_kw").val("");
            findList();
        });
        $("#req-register-btn").off("click").on("click", openCreatePopup);
        $("#req-save-btn").off("click").on("click", saveDraft);
    }

    function buildSearchParam(page, range, sortId, sortOrder) {
        if (!formUtil.checkEmptyValue(page)) page = 1;
        if (!formUtil.checkEmptyValue(range)) range = 10;
        let param = { page_no: page, row_range: range, offset: (page - 1) * range };
        let stat = $("#search_stat_cd").val();
        let kw = $("#search_kw").val();
        if (formUtil.checkEmptyValue(stat)) param.stat_cd = stat;
        if (formUtil.checkEmptyValue(kw)) param._user_id = kw;
        if (formUtil.checkEmptyValue(sortId)) param.sort_id = sortId;
        if (formUtil.checkEmptyValue(sortOrder)) param.sort_order = sortOrder;
        return param;
    }

    function findList(page, range, sortId, sortOrder) {
        let param = buildSearchParam(page, range, sortId, sortOrder);
        axios.post("/cms/common/sysUserReq/findPage", param).then(response => {
            if (response.status !== 200) return;
            let data = response.data.DATA;
            let paging = response.data.TOTAL_PAGING[0];
            let header = {
                title: "사용자 등록 신청 목록",
                list: [
                    { HEADER: 'No', ID: 'no', WIDTH: '7', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: '아이디', ID: 'user_id', WIDTH: '20', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: '이메일', ID: 'eml', WIDTH: '30', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: '이름', ID: 'fnm', WIDTH: '15', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: '상태', ID: 'stat_nm', WIDTH: '12', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: '신청일시', ID: 'sys_crt_dt', WIDTH: '20', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: false },
                    { HEADER: 'stat_cd', ID: 'stat_cd', WIDTH: '1', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true },
                    { HEADER: 'stat_raw', ID: 'stat_raw', WIDTH: '1', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true },
                    { HEADER: '수정', ID: 'edit_btn', WIDTH: '10', TYPE: 'button', FONT_SIZE: '12px', TEXT_ALIGN: 'center', VISIBLE_OPTION_BTN: [{ stat_raw: '1' }, { stat_raw: '2' }, { stat_raw: '3' }], HIDDEN: false },
                    { HEADER: '최종 신청', ID: 'submit_btn', WIDTH: '12', TYPE: 'button', FONT_SIZE: '12px', TEXT_ALIGN: 'center', VISIBLE_OPTION_BTN: [{ stat_raw: '1' }, { stat_raw: '2' }, { stat_raw: '3' }], HIDDEN: false },
                    { HEADER: 'req_id', ID: 'req_id', WIDTH: '10', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true },
                    { HEADER: 'telno', ID: 'telno', WIDTH: '10', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true },
                    { HEADER: 'role', ID: 'role', WIDTH: '10', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true },
                    { HEADER: 'req_rsn', ID: 'req_rsn', WIDTH: '10', TYPE: 'text', FONT_SIZE: '12px', TEXT_ALIGN: 'center', HIDDEN: true }
                ]
            };
            let grid = formUtil.giGrid(header, paging, param.page_no, "gi-Grid");
            grid.DataSet(data);
            grid.pagingSet(findList);
            grid.sortDataSet(findList);
            grid.updateBtnClick(openEditPopup, "edit_btn");
            grid.updateBtnClick(onFinalSubmitBtn, "submit_btn");
        }).catch(error => {
            formUtil.toast(error.response?.data || error, "error");
        });
    }

    // 신규 작성
    function openCreatePopup() {
        currentReqId = null;
        $("#userReq-popup-title").text("신청서 작성");
        commonTag.inputTagReset($("#sysUserReqForm .gi-input"));
        $("#sysUserReqForm .gi-input").prop("disabled", false);
        $("#req-save-btn").show();
        $("#" + EDIT_POPUPID).attr("data-popup-open", "true");
    }

    // '수정' 버튼(작성중 행에만 노출) 클릭 → 수정 팝업
    // NOTE: updateBtnClick 의 row 는 원본 코드값으로 구성됨
    function openEditPopup(row) {
        currentReqId = row.req_id;
        $("#userReq-popup-title").text("신청서 수정");
        $("#sysUserReqForm .gi-input").prop("disabled", false);
        $("#req-save-btn").show();
        dataBinding.setDataForm("sysUserReqForm", row);
        $("#" + EDIT_POPUPID).attr("data-popup-open", "true");
    }

    function collectFormData() {
        let data = dataBinding.getData("sysUserReqForm");
        if (!formUtil.checkEmptyValue(data.user_id) || !formUtil.checkEmptyValue(data.eml)) {
            formUtil.showMessage("아이디와 이메일은 필수입니다.");
            return null;
        }
        return data;
    }

    // 저장(임시저장): 신규=등록(0 대기) / 기존=수정
    async function saveDraft() {
        let data = collectFormData();
        if (!data) return false;
        try {
            if (!currentReqId) {
                let res = await axios.post("/cms/common/sysUserReq/registerDraft", data);
                currentReqId = res.data;
            } else {
                data.req_id = currentReqId;
                await axios.post("/cms/common/sysUserReq/update", data);
            }
            formUtil.toast("저장되었습니다.", "success");
            popup.close(EDIT_POPUPID);
            findList();
        } catch (error) {
            formUtil.alertPopup(error.response?.data || error);
        }
    }

    // '최종 신청' 버튼(대기 행에만 노출) 클릭 → 0 -> 1
    function onFinalSubmitBtn(row) {
        if (row.stat_cd !== "0") {
            formUtil.toast("대기 상태인 신청만 최종 신청할 수 있습니다.", "info");
            return;
        }
        axios.post("/cms/common/sysUserReq/submit", { req_id: row.req_id }).then(response => {
            if (response.status === 200) {
                formUtil.toast("최종 신청되었습니다.", "success");
                findList();
            }
        }).catch(error => {
            formUtil.alertPopup(error.response?.data || error);
        });
    }
</script>
