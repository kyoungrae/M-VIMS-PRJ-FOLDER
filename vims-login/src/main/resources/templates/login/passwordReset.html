<article id="password-reset-popup" class="gi-popup login-page" data-popup-open="false">
    <div class="gi-popup-body login-page" style="width: 360px; height:auto; min-height:280px; padding:10px;">
        <div class="gi-popup-header">
            <span>[Page.Message].Message.Label.Array["LOGIN.RESET_PWD_TITLE"]</span>

        <div class="gi-popup-contents">
            <form id="passwordResetForm" class="gi-row-100 gi-col-100">
                <div class="gi-flex gi-flex-column gi-grid-gap-16px gi-padding-left-right-20px">
                    <div class="gi-input-container">
                        <label for="new_pwd" class="gi-input-label" data-focus-label="true"
                            data-required="true">[Page.Message].Message.Label.Array["LOGIN.NEW_PWD"]</label>
                        <input type="password" data-field="new_pwd" id="new_pwd" name="new_pwd" class="gi-input"
                            data-required="true" autocomplete="off" />
                    </div>
                    <div class="gi-input-container">
                        <label for="new_pwd_confirm" class="gi-input-label" data-focus-label="true"
                            data-required="true">[Page.Message].Message.Label.Array["LOGIN.NEW_PWD_CONFIRM"]</label>
                        <input type="password" data-field="new_pwd_confirm" id="new_pwd_confirm" name="new_pwd_confirm"
                            class="gi-input" data-required="true" autocomplete="off" />
                    </div>
                </div>
            </form>
        </div>
        <div class="gi-popup-footer">
            <div class="gi-flex gi-flex-justify-content-center gi-grid-gap-16px gi-margin-top-20px">
                <button id="reset-confirm-btn" class="gi-btn-blue"
                    type="button">[Page.Message].Message.Label.Array["CONFIRM"]</button>
                <button id="reset-cancel-btn" class="gi-popup-close-btn"
                    type="button">[Page.Message].Message.Label.Array["CLOSE_BTN"]</button>
            </div>
        </div>
    </div>
</article>

</html>
<script>
    let formUtil = new FormUtility();
    let commonTag = new CommonTag();
    const RESET_TOKEN_KEY = "pwdResetToken";

    init();

    function init() {
        new loadToScript();
        new PageInit();

        // 재설정 토큰 확인 (인증코드 검증 성공 시 sessionStorage 에 저장됨)
        let resetToken = sessionStorage.getItem(RESET_TOKEN_KEY);
        if (!formUtil.checkEmptyValue(resetToken)) {
            // 토큰이 없으면 비정상 접근 → 안내 후 로그인으로
            // (메시지 파일은 비동기 로드되므로 로드 여부를 안전하게 확인)
            let msg = (typeof Message !== "undefined" && Message.Label)
                ? Message.Label.Array["LOGIN.RESET_PWD_INVALID_ACCESS"] : "";
            if (msg) formUtil.showMessage(msg);
            setTimeout(goLogin, 1500);
            return;
        }

        // 비밀번호 재설정 팝업 자동 노출
        $("#password-reset-popup").attr("data-popup-open", "true");

        clickEvent();
    }

    function clickEvent() {
        $("#go-login-btn").on("click", goLogin);
        $("#reset-confirm-btn").on("click", resetPassword);
    }

    async function resetPassword() {
        let resetToken = sessionStorage.getItem(RESET_TOKEN_KEY);
        let newPassword = $("#new_pwd").val();
        let newPasswordConfirm = $("#new_pwd_confirm").val();

        if (!formUtil.checkEmptyValue(newPassword)) {
            formUtil.showMessage(Message.Label.Array["CHECK.INPUT.PWD"]);
            return false;
        }
        if (!formUtil.checkEmptyValue(newPasswordConfirm)) {
            formUtil.showMessage(Message.Label.Array["CHECK.INPUT.PWD_CHECK"]);
            return false;
        }
        if (newPassword !== newPasswordConfirm) {
            formUtil.showMessage(Message.Label.Array["FAIL.COMPARE.PWD"]);
            return false;
        }

        let url = "/api/v1/auth/password/reset";
        let param = {
            resetToken: resetToken,
            newPassword: newPassword,
            newPasswordConfirm: newPasswordConfirm
        };

        try {
            const response = await axios.post(url, param);
            if (response.status === 200) {
                sessionStorage.removeItem(RESET_TOKEN_KEY);
                formUtil.showMessage(Message.Label.Array["COMPLETE.UPDATE"]);
                setTimeout(goLogin, 1200);
            }
        } catch (error) {
            const errorData = error.response?.data;
            formUtil.toast(errorData || error.message || error, "error");
        }
    }

    function goLogin() {
        window.location.href = "/";
    }
</script>
