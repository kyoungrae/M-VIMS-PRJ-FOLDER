    /**
     * NOTE: 사이드 메뉴바 너비 조절(드래그 리사이즈)
     *  - 오른쪽 가장자리 핸들(.gi-side-nav-resizer)을 드래그하여 너비 조절
     *  - 조절값은 localStorage("giSideNavWidth")에 저장하여 재방문 시 복원
     */
    function sideNavResizeEvent() {
        var MIN_WIDTH = 180;
        var MAX_WIDTH = 480;
        var $resizer = $(".gi-side-nav-resizer");
        if ($resizer.length === 0) return;

        // 저장된 너비 복원
        var savedWidth = parseInt(localStorage.getItem("giSideNavWidth"), 10);
        if (!isNaN(savedWidth)) {
            savedWidth = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, savedWidth));
            document.documentElement.style.setProperty("--gi-side-nav-width", savedWidth + "px");
        }

        var dragging = false;

        $resizer.off("mousedown.giSideNavResize").on("mousedown.giSideNavResize", function (e) {
            e.preventDefault();
            dragging = true;
            $("body").addClass("gi-side-nav-resizing");
        });

        // 더블클릭 시 기본 너비(14%)로 초기화
        $resizer.off("dblclick.giSideNavResize").on("dblclick.giSideNavResize", function (e) {
            e.preventDefault();
            document.documentElement.style.removeProperty("--gi-side-nav-width");
            localStorage.removeItem("giSideNavWidth");
        });

        $(document).off("mousemove.giSideNavResize").on("mousemove.giSideNavResize", function (e) {
            if (!dragging) return;
            // 사이드바는 화면 왼쪽(left:0) 기준이므로 마우스 X 좌표가 곧 너비
            var newWidth = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, e.clientX));
            document.documentElement.style.setProperty("--gi-side-nav-width", newWidth + "px");
        });

        $(document).off("mouseup.giSideNavResize").on("mouseup.giSideNavResize", function () {
            if (!dragging) return;
            dragging = false;
            $("body").removeClass("gi-side-nav-resizing");
            var cur = parseInt(getComputedStyle(document.documentElement)
                .getPropertyValue("--gi-side-nav-width"), 10);
            if (!isNaN(cur)) localStorage.setItem("giSideNavWidth", cur);
        });
    }
    function layoutClickEvent() {
        /**
         * NOTE: 프로필 사이드네비 OPEN
         * */
        $(".side-nav-profile-trigger").on("click", function (e) {
            dropDownMenu("open");
            isDropMenuOpenSetClose();
        });

        /**
         * NOTE: 로그아웃 버튼 이벤트
         */
        $("#logout-btn").off().on("click", function () {
            $("body").removeClass('animate-content-end');
            setTimeout(function () {
                $("body").addClass('animate-content-start');
                window.location.href = "/api/v1/auth/logout";
            });
        });
    }

    //NOTE : 내정보 메뉴 이벤트
    function dropDownMenu(flag) {
        if (flag === "open") {
            $(".dropdown-menu").stop(true, true).slideToggle(150).css("display", "flex");
            $(".side-nav-profile-dropdown").toggleClass("active");
            $(".side-nav-profile-trigger").toggleClass("active");
        } else if (flag === "close") {
            $(".dropdown-menu").stop(true, true).slideToggle(150).css("display", "none");
            $(".side-nav-profile-dropdown").removeClass("active");
            $(".side-nav-profile-trigger").removeClass("active");
        }
    }
    function findUserName() {
        const email = JwtUtils.getUserEmailFromJWT();
        const url = "/cms/common/sysUser/find";

        axios.post(url, { eml: email }).then(response => {
            const data = response.data[0];
            const userName = data.fnm || data.user_nm || "";
            const officeName = data.inst_nm || data.offc_nm || "";
            $('#user-name-span').text(userName).css('font-size', '1rem');
            $('#office-name-span').text(officeName).css('font-size', '0.8rem');
        }).catch(error => {
            formUtil.showMessage("can not find user name");
        });
    }

    /**
     * NOTE: 메뉴바 OPEN,CLOSE EVENT(노출 or 숨김)
     */
    function sideNaveOpenCloseEvent() {
        let giSideNavToggleButtonArea = $(".gi-side-nav-toggle-button-area");
        /**
         * NOTE: BTN HOVER EVENT
         */
        giSideNavToggleButtonArea.hover(
            function () {
                $(this).find("i").addClass("fa-beat-fade"); // hover 시 fa-fade 클래스 추가
            },
            function () {
                $(this).find("i").removeClass("fa-beat-fade"); // hover 해제 시 fa-fade 클래스 제거
            }
        );

        giSideNavToggleButtonArea.on("click", function () {
            let $toggleButton = $(this);

            if ($toggleButton.hasClass("collapsed")) {
                $toggleButton.removeClass("collapsed");
                $(".main-nav-menu").removeClass("visible");
                $(".gi-main-nav-logo-area").removeClass("visible");
                $(".gi-side-nav").removeClass("collapsed").addClass("expand");
            } else {
                $toggleButton.addClass("collapsed");
                $(".main-nav-menu").addClass("visible");
                $(".gi-main-nav-logo-area").addClass("visible");
                $(".gi-side-nav").removeClass("expand").addClass("collapsed");
            }

            let mainArea = $("[data-side-nav-toggle-area]");

            // sideNav, mainArea handling
            mainArea.each(function () {
                if ($(this).hasClass("expand")) {
                    $(this).removeClass("expand");
                    $(this).addClass("collapsed");
                } else {
                    $(this).removeClass("collapsed");
                    $(this).addClass("expand");
                }
            });

            // popup area handling
            $("#gi-search-popup").toggleClass("gi-row-84-important");
        });
    }

    /**
     * NOTE : 메뉴데이터 조회
     */
    function findByMenuList() {
        let url = "/cms/common/sysMenu/findAccessRightGroupForMenu";
        let param = {};
        axios.post(url, param).then(response => {
            let status = response.status;
            if (status === 200) {
                let data = response.data;
                let sideNavMenuList1Depth = [];
                let sideNavMenuList2Depth = [];
                let sideNavMenuList3Depth = [];

                let menuTree = [];
                let menuMap = {};

                // 현재 언어 설정 가져오기
                const currentLang = localStorage.getItem("selectedLanguage") || "ko";

                data.sort((a, b) => parseInt(a.menu_lvl) - parseInt(b.menu_lvl));

                data.map((item) => {
                    if (!formUtil.checkEmptyValue(item.menu_lvl)) {
                        formUtil.alertPopup("item.menu_lvl is undefined");
                        return false;
                    }

                    // 언어에 따른 메뉴명 결정
                    let menuName = item.menu_nm_kr;
                    if (currentLang === "mn" && item.menu_nm_mn) menuName = item.menu_nm_mn;
                    else if (currentLang === "en" && item.menu_nm_en) menuName = item.menu_nm_en;

                    switch (item.menu_lvl) {
                        case '0':
                            sideNavMenuList1Depth.push({
                                menu_cd: item.menu_cd,
                                top_menu_cd: item.top_menu_cd,
                                menu_name: menuName,
                                menu_lvl: item.menu_lvl,
                                url: item.URL,
                                menu_icon: item.menu_icon,
                                menu_no: item.menu_no
                            });
                            break;

                        case '1':
                            sideNavMenuList2Depth.push({
                                menu_cd: item.menu_cd,
                                top_menu_cd: item.top_menu_cd,
                                menu_name: menuName,
                                menu_lvl: item.menu_lvl,
                                url: item.url,
                                menu_icon: item.menu_icon,
                                menu_no: item.menu_no
                            });
                            break;

                        case '2':
                            sideNavMenuList3Depth.push({
                                menu_cd: item.menu_cd,
                                top_menu_cd: item.top_menu_cd,
                                menu_name: menuName,
                                menu_lvl: item.menu_lvl,
                                url: item.url,
                                prgm_url: item.prgm_url,
                                menu_icon: item.menu_icon,
                                menu_no: item.menu_no
                            });
                            break;
                    }
                    //NOTE: menu_no 에 따른 순서 정렬 설정
                    sideNavMenuList1Depth.sort((a, b) => Number(a.menu_no) - Number(b.menu_no));
                    sideNavMenuList2Depth.sort((a, b) => Number(a.menu_no) - Number(b.menu_no));
                    sideNavMenuList3Depth.sort((a, b) => Number(a.menu_no) - Number(b.menu_no));

                    let menuItem = {
                        menu_cd: item.menu_cd,
                        top_menu_cd: item.top_menu_cd,
                        menu_name: menuName,
                        menu_lvl: item.menu_lvl,
                        url: item.url,
                        menu_icon: item.menu_icon,
                        children: [] // 하위 메뉴를 담을 배열
                    };

                    menuMap[item.menu_cd] = menuItem; // 검색을 빠르게 하기 위한 맵

                    // 최상위 메뉴 (level 0)
                    if (item.menu_lvl === "0") {
                        menuTree.push(menuItem);
                    } else {
                        // 부모 메뉴 찾기
                        let parent = menuMap[item.top_menu_cd];
                        if (parent) {
                            parent.children.push(menuItem);
                        }
                    }
                });
                menuInfoList = menuTree
                /* side nav */
                let sideNavMenuHtml = createSideNavMenuList(sideNavMenuList1Depth, sideNavMenuList2Depth, sideNavMenuList3Depth);
                $("#side_nav_menu").html(sideNavMenuHtml);
                sideNavTitleClick();
                existsNavSelected();
            } else {
                formUtil.alertPopup("response status is :" + status);
            }
        }).catch(error => {
            formUtil.alertPopup(error);
        })
    }

    //NOTE : 사이드 네비 메뉴리스트 생성
    function createSideNavMenuList(sideNavMenuList1Depth, sideNavMenuList2Depth, sideNavMenuList3Depth) {
        let sideNavMenuHtml = "";

        sideNavMenuList1Depth.map(menu1 => {
            sideNavMenuHtml += "<li class='gi-side-nav-menu-item gi-margin-bottom-26px'>"
                + "<a href='#' class='gi-side-nav-title collapsed' data-menu-level='" + menu1.menu_lvl + "' data-menu-code='" + menu1.menu_cd + "'>"
                + "<i class='fa-inverse gi-side-nav-title-icon fa-solid " + menu1.menu_icon + "'></i>"
                + "<span>" + menu1.menu_name + "</span>"
                + "<span class='fa-solid fa-angle-right'></span>"
                + "</a>";

            if (formUtil.checkEmptyValue(sideNavMenuList2Depth)) {
                let menu2Children = sideNavMenuList2Depth.filter(menu2 => menu1.menu_cd === menu2.top_menu_cd);
                if (menu2Children.length > 0) {
                    sideNavMenuHtml += "<ul class='gi-side-nav-menu-level'>";

                    menu2Children.map(menu2 => {
                        sideNavMenuHtml += "<li class='gi-side-nav-menu-item child'>"
                            + "<a href='#' class='gi-margin-left-5 gi-side-nav-title collapsed' data-menu-level='" + menu2.menu_lvl + "' data-menu-code='" + menu2.menu_cd + "'>"
                            + "<span>" + menu2.menu_name + "</span>"
                            + "<span class='fa-solid fa-angle-right'></span>"
                            + "</a>";

                        if (formUtil.checkEmptyValue(sideNavMenuList3Depth)) {
                            let menu3Children = sideNavMenuList3Depth.filter(menu3 => menu2.menu_cd === menu3.top_menu_cd);
                            if (menu3Children.length > 0) {
                                sideNavMenuHtml += "<ul class='gi-side-nav-menu-level'>";
                                menu3Children.map(menu3 => {
                                    sideNavMenuHtml += "<li class='gi-margin-left-5 gi-side-nav-menu-item child'>"
                                        + "<a href='#' class='sideNavPageLoad gi-side-nav-title' data-prgm-url='" + menu3.prgm_url + "' data-page-name='" + menu3.url + "' data-menu-level='" + menu3.menu_lvl + "' data-menu-code='" + menu3.menu_cd + "'>"
                                        + "<span>" + menu3.menu_name + "</span>"
                                        + "</a>"
                                        + "</li>";
                                });
                                sideNavMenuHtml += "</ul>";
                            }
                        }

                        sideNavMenuHtml += "</li>";
                    });

                    sideNavMenuHtml += "</ul>";
                }
            }
            sideNavMenuHtml += "</li>";
        });

        return sideNavMenuHtml;
    }
    //NOTE : 사이드 네비게이션 타이틀 클릭 이벤트
    function sideNavTitleClick() {
        $('.gi-side-nav-title').off("click").on('click', function (e) {
            e.preventDefault();

            let $this = $(this);
            let $currentSubMenu = $this.nextAll(".gi-side-nav-menu-level");
            let menuLevel = $this.data("menu-level");
            let recentPageItem = common_session.getItem("recentPage");
            let recentPage = recentPageItem ? recentPageItem.url : "";

            // 비활성화 된 메뉴 클릭 시
            if (!$this.hasClass("active")) {
                // 활성화 되지 않은 로드 버튼 클릭 시
                if ($this.hasClass("sideNavPageLoad")) {
                    // 1. 현재 클릭한 페이지가 속한 경로가 아닌 다른 1뎁스 브랜치들을 부드럽게 정리
                    let $currentTopLi = $this.parents("li").last();
                    $("#side_nav_menu > li").not($currentTopLi).each(function () {
                        let $otherTopLi = $(this);
                        $otherTopLi.find("a.gi-side-nav-title.active").removeClass("active").addClass("collapsed");
                        $otherTopLi.find("ul.gi-side-nav-menu-level:visible").stop(true, true).slideUp(250);
                    });

                    // 2. 현재 브랜치 내의 다른 페이지 하이라이트만 정리 (카테고리는 유지)
                    $currentTopLi.find(".sideNavPageLoad.active").removeClass("active page");

                    // 3. 마지막으로 클릭한 버튼 활성화 및 페이지 로드
                    $this.addClass("active page");
                    let url = $this.data("page-name");
                    let prgmUrl = $this.data("prgm-url");
                    let menuCode = $this.data("menu-code");
                    let urlInfo = { url: url, prgmUrl: prgmUrl }
                    common_session.setItem("recentPage", urlInfo);
                    common_session.setItem("activatedMenu", urlInfo);

                    let payload = url === "/bbs/view" ? { bbs_id: menuCode, bbs_nm: $this.text().trim() } : $this.text();
                    formUtil.apiLoadContent(prgmUrl, url, payload);
                } else {
                    // 카테고리(서브메뉴) 펼침 동작 - 다른 같은 레벨의 서브메뉴만 부드럽게 닫기
                    $this.closest("ul").children("li").find("ul.gi-side-nav-menu-level:visible").not($currentSubMenu).stop(true, true).slideUp(250);
                    $this.closest("ul").children("li").find("a.gi-side-nav-title.active")
                        .not($this)
                        .not(".sideNavPageLoad.page")
                        .removeClass("active")
                        .addClass("collapsed");

                    $currentSubMenu.stop(true, true).slideDown(250);
                    $this.removeClass("collapsed").addClass("active");
                    restoreActivePageBranch($this.parent("li"));
                }
            } else {
                // 활성화 된 로드 버튼 클릭 시
                if ($this.hasClass("sideNavPageLoad")) {
                    let url = $this.data("page-name");
                    let prgmUrl = $this.data("prgm-url");
                    let menuCode = $this.data("menu-code");
                    let urlInfo = { url: url, prgmUrl: prgmUrl }
                    common_session.setItem("recentPage", urlInfo);
                    common_session.setItem("activatedMenu", urlInfo);

                    let payload = url === "/bbs/view" ? { bbs_id: menuCode, bbs_nm: $this.text().trim() } : $this.text();
                    formUtil.apiLoadContent(prgmUrl, url, payload);
                } else {
                    // 활성화 된 최상위 메뉴 클릭 시
                    if (menuLevel.toString() === "0") {
                        let allSubMenu = $this.closest('li').find('ul');

                        // 첫번째 메뉴 버튼이면서 하위 로드 버튼이 활성화 되어있을 때
                        if ($this.parent("li").find("a.active.page").length > 0) {
                            // 하위 메뉴 버튼과 영역들은 숨김 처리하지만 로드 버튼 비활성화 처리는 하지 않는다.
                            allSubMenu.each(function (i, subMenu) {
                                let $menu = $(subMenu);
                                $menu.stop(true, true).slideUp(250);
                                $menu.find("a:not(.sideNavPageLoad)").removeClass("active").addClass("collapsed");
                            });
                            $this.removeClass("active").addClass("collapsed");
                        } else {
                            // 첫번째 메뉴 버튼이면서 하위 로드 버튼이 활성화 되어있지 않을 때
                            // 하위 메뉴 버튼과 영역들을 숨김 처리하면서 비활성화 처리도 한다.
                            allSubMenu.each(function (i, subMenu) {
                                let $menu = $(subMenu);
                                $menu.stop(true, true).slideUp(250);
                                $menu.find(".gi-side-nav-title").removeClass("active");
                            });
                            $this.removeClass("active").addClass("collapsed");
                        }
                    } else {
                        // 활성화 된 두번째 메뉴 버튼 일때는 하위 ul 숨김처리하고 비활성화(remove active) 처리
                        // 만약 하위에 활성화 된 버튼이 있다면 해당 버튼은 비활성화 하지않는다.
                        if ($this.parent("li").find("a.active.page").length > 0) {
                            $this.removeClass("active").addClass("collapsed");
                            $currentSubMenu.stop(true, true).slideUp(150);
                        } else {
                            $this.removeClass("active").addClass("collapsed");
                            $currentSubMenu.stop(true, true).slideUp(150);
                        }
                    }
                }
            }
            syncSideNavActivePath();
        });
    }
    function restoreActivePageBranch($scope) {
        let $activePage = $scope.find(".sideNavPageLoad.page").last();
        if ($activePage.length === 0) return;

        $activePage.addClass("active");
        $activePage.parents("ul.gi-side-nav-menu-level").stop(true, true).show();
        $activePage.parents("li.gi-side-nav-menu-item.child").children("a.gi-side-nav-title")
            .removeClass("collapsed")
            .addClass("active");
    }
    function syncSideNavActivePath() {
        let $sideNavMenu = $("#side_nav_menu");

        let $activePage = $sideNavMenu.find(".gi-side-nav-title.active.page").last();
        if ($activePage.length === 0) {
            $activePage = $sideNavMenu.find(".gi-side-nav-title.page").last();
            if ($activePage.length > 0) {
                $activePage.addClass("active");
            }
        }
        let $activeLi = $activePage.closest("li.gi-side-nav-menu-item.child");
        if ($activeLi.length === 0) {
            syncSideNavClass($sideNavMenu, "gi-side-nav-active-path", $());
            syncSideNavClass($sideNavMenu, "gi-side-nav-active-branch", $());
            syncSideNavClass($sideNavMenu, "gi-side-nav-active-current", $());
            return;
        }

        let $pathItems = $activeLi.add($activeLi.parents("li.gi-side-nav-menu-item.child"));
        let $branchItems = $();

        $pathItems.each(function () {
            $branchItems = $branchItems.add($(this).prevAll("li.gi-side-nav-menu-item.child"));
        });

        syncSideNavClass($sideNavMenu, "gi-side-nav-active-path", $pathItems);
        syncSideNavClass($sideNavMenu, "gi-side-nav-active-branch", $branchItems);
        syncSideNavClass($sideNavMenu, "gi-side-nav-active-current", $activeLi);
    }
    function syncSideNavClass($root, className, $targets) {
        $root.find("." + className).not($targets).removeClass(className);
        $targets.not("." + className).addClass(className);
    }
    function existsNavSelected() {
        let recentPageItem = common_session.getItem("recentPage");
        let recentPage = recentPageItem ? recentPageItem.url : null;
        if (formUtil.checkEmptyValue(recentPage)) {
            formUtil.activatedMenu(recentPage);
        } else {
            let allLiButtonList = $("#side_nav_menu > li");
            allLiButtonList.each(function () {
                let $button = $(this);
                $button.find("a:not(.sideNavPageLoad)").removeClass("active").addClass("collapsed");
                $button.find("a.sideNavPageLoad").removeClass("active page");
                $button.find("ul").hide(); // 초기 로드 시에는 애니메이션 없이 즉시 숨김
            });
        }
        syncSideNavActivePath();
        formUtil.restoreCurrentPageContent();
    }
    //NOTE: 내정보 수정
    $("#myinfo-btn").off("click").on("click", function (e) {
        e.preventDefault();
        let url = "/user/myinfo";
        dropDownMenu("close");
        common_session.setItem("recentPage", { url: url, prgmUrl: "cms" });
        formUtil.apiLoadContent("cms", url, "");
        allCloseMenuTitle();
    });
    //NOTE: 모든 매뉴 닫기
    function allCloseMenuTitle() {
        let sideNavTitleVolume = $(".gi-side-nav-menu-item").find(".gi-side-nav-title");
        let sideNavMenuLevelVolume = $(".gi-side-nav-menu-item").find(".gi-side-nav-menu-level");
        sideNavTitleVolume.map((index, item) => {
            if ($(item).hasClass("active")) {
                $(item).removeClass("active");
                $(item).addClass("collapsed");
            }

            if ($(item).hasClass("page")) {
                $(item).removeClass("page");
            }
        })
        sideNavMenuLevelVolume.map((index, item) => {
            $(item).css("display", "none");
        })
        syncSideNavActivePath();
    }

    //NOTE: DropDownMenu를 제외한 부분을 클릭하면 DropDownMenu 비활성화 처리
    function isDropMenuOpenSetClose() {
        let flag = $(".side-nav-profile-dropdown").hasClass("active");
        if (flag) {
            $(document).off("click.unOtherAreaClickEventHandler").on("click.unOtherAreaClickEventHandler", function (e) {
                unOtherAreaClickEventHandler(e);
            });

        }
        function unOtherAreaClickEventHandler(e) {
            if (!$(e.target).closest(".dropdown-menu , .side-nav-profile-dropdown").length) {
                dropDownMenu("close");
            }
        }
    }

    /**
     * NOTE: 언어 선택 세그먼트 컨트롤 초기화
     */
    function initLanguageSelector() {
        const $languageToggle = $("#languageToggle");
        const $slider = $("#languageSlider");
        const $options = $(".gi-language-option");
        const $currentLangCode = $("#currentLangCode");

        // 언어 코드 매핑
        const langCodeMap = {
            ko: "KO",
            mn: "MN",
            en: "EN"
        };

        // 저장된 언어 설정 복원
        const savedLang = localStorage.getItem("selectedLanguage") || "ko";
        setActiveLanguage(savedLang);

        // 언어 옵션 클릭 이벤트
        $options.on("click", function () {
            const $this = $(this);
            const lang = $this.data("lang");

            setActiveLanguage(lang);
            localStorage.setItem("selectedLanguage", lang);

            // 언어 변경 이벤트 발생 (다른 컴포넌트에서 사용 가능)
            $(document).trigger("languageChanged", [lang]);

            // 페이지 새로고침 (언어 적용)
            setTimeout(() => location.reload(), 300);
        });

        // 언어 트리거 버튼 클릭 이벤트
        $("#languageTrigger").on("click", function (e) {
            e.stopPropagation();
            $(".gi-home-setting-article").toggleClass("lang-panel-closed");
        });

        // 설정 영역 외부 클릭 시 닫기
        $(document).on("click", function (e) {
            if (!$(e.target).closest("#languageTrigger, .gi-home-setting-article").length) {
                $(".gi-home-setting-article").addClass("lang-panel-closed");
            }
        });

        function setActiveLanguage(lang) {
            const $targetOption = $options.filter(`[data-lang="${lang}"]`);
            const index = $options.index($targetOption);

            // 활성화 상태 변경
            $options.removeClass("active");
            $targetOption.addClass("active");

            // 슬라이더 위치 변경
            $slider.removeClass("position-0 position-1 position-2");
            $slider.addClass(`position-${index}`);

            // 현재 언어 코드 업데이트
            $currentLangCode.text(langCodeMap[lang] || "KO");
        }
    }
</script>
