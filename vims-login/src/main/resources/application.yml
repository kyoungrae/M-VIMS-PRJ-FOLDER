server:
    port: 8081
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true

gateway:
    url: http://localhost:8080

spring:
    profiles:
        active: local
    jackson:
        property-naming-strategy: LOWER_CAMEL_CASE
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: Asia/Seoul
    datasource:
        # MariaDB JDBC URL
        url: jdbc:mariadb://192.168.0.232:3306/NEW_MVIMS?autoReconnect=true&tcpKeepAlive=true
        username: ${DB_USERNAME:mvims2}
        password: ${DB_PASSWORD:1234}   # 운영 시 DB_PASSWORD 환경변수로 주입 권장
        driver-class-name: org.mariadb.jdbc.Driver

        hikari:
            maximum-pool-size: 10
            idle-timeout: 120000         # 2분 (max-lifetime보다 작게 설정)
            max-lifetime: 180000         # 3분
            connection-timeout: 30000
            keepalive-time: 60000        # 1분 (커넥션 유효성 주기적 체크)

    jpa:
        show-sql: false
        properties:
            hibernate:
                hbm2ddl:
                    auto: none
                format_sql: true
                use_sql_comments: false  # SQL 주석을 비활성화하여 주석 없이 출력
        database: mysql
        database-platform: org.hibernate.dialect.MariaDB103Dialect
    thymeleaf:
        cache: false
        check-template-location: true
        prefix: classpath:/templates/
        suffix: .html
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true
    messages:
        basename : exceptionMessage
        encoding : UTF-8
    # 비밀번호 찾기 인증코드 메일 발송용 SMTP 설정 (운영 시 환경변수 주입 권장)
    # Gmail을 쓴다면 일반 비밀번호는 막혀 있습니다. 2단계 인증을 켠 뒤 **앱 비밀번호(16자리)**를 발급해 MAIL_PASSWORD에 넣고, MAIL_USERNAME은 전체 이메일 주소로 지정하세요.
    # 사내 메일 서버라면 그 서버의 호스트/포트/계정을 넣으세요. SSL(465) 방식이면 starttls 대신 ssl.enable: true + 포트 465로 바꿔야 합니다.
    mail:
        host: ${MAIL_HOST:smtp.gmail.com}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME:go66go66@giens.co.kr}
        password: ${MAIL_PASSWORD:pxqdjcpekvmpvoiy}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

# 비밀번호 찾기(재설정) 기능 설정
app:
    password-reset:
        code-ttl-seconds: 180        # 인증코드 유효시간(3분)
        token-ttl-seconds: 300       # 재설정 토큰 유효시간(5분)
        max-verify-attempts: 5       # 인증코드 검증 최대 시도 횟수
        resend-interval-seconds: 30  # 인증코드 재발송 최소 간격

mybatis:
    config-location: classpath:/mybatis-config.xml
    mapper-locations: classpath*:/mybatis*/**/*.xml

logging:
    level:
        root: INFO
        com.system: DEBUG
        org.apache.ibatis: DEBUG
        java.sql: DEBUG
        org.springframework.jdbc: DEBUG