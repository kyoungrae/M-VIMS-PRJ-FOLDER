server:
    port: 8081
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true

gateway:
    url: http://localhost:8080

spring:
    profiles:
        active: local
    jackson:
        property-naming-strategy: LOWER_CAMEL_CASE
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: Asia/Seoul
    datasource:
        # MariaDB JDBC URL
        url: jdbc:mariadb://192.168.0.232:3306/NEW_MVIMS?autoReconnect=true&tcpKeepAlive=true
        username: ${DB_USERNAME:mvims2}
        password: ${DB_PASSWORD:1234}   # 운영 시 DB_PASSWORD 환경변수로 주입 권장
        driver-class-name: org.mariadb.jdbc.Driver

        hikari:
            maximum-pool-size: 10
            idle-timeout: 120000         # 2분 (max-lifetime보다 작게 설정)
            max-lifetime: 180000         # 3분
            connection-timeout: 30000
            keepalive-time: 60000        # 1분 (커넥션 유효성 주기적 체크)

    jpa:
        show-sql: false
        properties:
            hibernate:
                hbm2ddl:
                    auto: none
                format_sql: true
                use_sql_comments: false  # SQL 주석을 비활성화하여 주석 없이 출력
        database: mysql
        database-platform: org.hibernate.dialect.MariaDB103Dialect
    thymeleaf:
        cache: false
        check-template-location: true
        prefix: classpath:/templates/
        suffix: .html
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true
    messages:
        basename : exceptionMessage
        encoding : UTF-8
    # 비밀번호 찾기 인증코드 메일 발송용 SMTP 설정
    # !! 자격증명(계정/비밀번호)은 코드에 절대 넣지 말고 환경변수로만 주입할 것 !!
    #    실행 시: MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD 환경변수 설정
    mail:
        host: ${MAIL_HOST:smtp.gmail.com}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

# 비밀번호 찾기(재설정) 기능 설정
app:
    password-reset:
        code-ttl-seconds: 180        # 인증코드 유효시간(3분)
        token-ttl-seconds: 300       # 재설정 토큰 유효시간(5분)
        max-verify-attempts: 5       # 인증코드 검증 최대 시도 횟수
        resend-interval-seconds: 30  # 인증코드 재발송 최소 간격

mybatis:
    config-location: classpath:/mybatis-config.xml
    mapper-locations: classpath*:/mybatis*/**/*.xml

logging:
    level:
        root: INFO
        com.system: DEBUG
        org.apache.ibatis: DEBUG
        java.sql: DEBUG
        org.springframework.jdbc: DEBUG