<svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No Data">
  <defs>
    <linearGradient id="ndDoc" x1="70" y1="40" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f5fe"/>
    </linearGradient>
    <linearGradient id="ndGlass" x1="120" y1="120" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f76ee"/>
      <stop offset="1" stop-color="#565fe0"/>
    </linearGradient>
  </defs>

  <!-- soft background blob -->
  <circle cx="110" cy="96" r="78" fill="#eef0fc"/>
  <circle cx="110" cy="96" r="78" fill="#ffffff" opacity="0.0"/>

  <!-- decorative marks -->
  <g stroke="#c7cbf4" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M34 70 q-10 26 8 44" stroke-dasharray="3 9"/>
    <path d="M44 44 l7 7 M51 44 l-7 7"/>
    <path d="M185 58 l8 0 M189 54 l0 8"/>
  </g>
  <g fill="#c7cbf4" opacity="0.9">
    <circle cx="40" cy="120" r="3"/>
    <circle cx="182" cy="118" r="3.4"/>
    <circle cx="168" cy="40" r="2.6"/>
  </g>
  <path d="M150 86 l16 -8 -4 12" stroke="#c7cbf4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- document -->
  <g>
    <rect x="66" y="46" width="84" height="104" rx="9" fill="url(#ndDoc)" stroke="#e2e4f6" stroke-width="1.5"/>
    <!-- folded corner -->
    <path d="M132 46 h0 a9 9 0 0 1 0 0 l18 18 v-9 a9 9 0 0 0 -9 -9 z" fill="#dfe2fb"/>
    <path d="M132 46 l18 18 h-12 a6 6 0 0 1 -6 -6 z" fill="#cdd2f7"/>
    <!-- text lines -->
    <g fill="#d7daf3">
      <rect x="80" y="72" width="56" height="7" rx="3.5"/>
      <rect x="80" y="88" width="44" height="7" rx="3.5"/>
      <rect x="80" y="104" width="50" height="7" rx="3.5"/>
      <rect x="80" y="120" width="32" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- magnifying glass -->
  <g>
    <circle cx="138" cy="128" r="27" fill="#ffffff" stroke="url(#ndGlass)" stroke-width="7"/>
    <circle cx="138" cy="128" r="18" fill="#f0f1fe" opacity="0.7"/>
    <rect x="156" y="146" width="13" height="30" rx="6.5" transform="rotate(-45 156 146)" fill="url(#ndGlass)"/>
  </g>
</svg>
