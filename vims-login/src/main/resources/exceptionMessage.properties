# exceptionMessage.properties

# 비밀번호 찾기(재설정)
EXCEPTION.NOT.FOUND.USER = 사용자가 존재하지 않습니다
EXCEPTION.PWD.RESET.CODE.SEND_FAIL = 인증코드 메일 발송에 실패했습니다. 잠시 후 다시 시도해 주세요
EXCEPTION.PWD.RESET.CODE.TOO_FREQUENT = 인증코드를 너무 자주 요청했습니다. 잠시 후 다시 시도해 주세요
EXCEPTION.PWD.RESET.CODE.NOT_REQUESTED = 인증코드가 발송되지 않았습니다
EXCEPTION.PWD.RESET.CODE.EXPIRED = 인증코드가 만료되었습니다. 다시 요청해 주세요
EXCEPTION.PWD.RESET.CODE.ATTEMPTS_EXCEEDED = 인증 시도 횟수를 초과했습니다. 다시 요청해 주세요
EXCEPTION.PWD.RESET.CODE.MISMATCH = 인증코드가 일치하지 않습니다
EXCEPTION.PWD.RESET.TOKEN.INVALID = 유효하지 않은 요청입니다. 처음부터 다시 시도해 주세요
EXCEPTION.PWD.RESET.TOKEN.EXPIRED = 재설정 시간이 만료되었습니다. 처음부터 다시 시도해 주세요
EXCEPTION.PWD.CONFIRM_NOT_MATCH = 비밀번호 확인이 일치하지 않습니다
EXCEPTION.PWD.RESET = 비밀번호 재설정에 실패했습니다
EXCEPTION.PWD.POLICY.LOAD_FAILED = 비밀번호 정책을 불러오지 못했습니다. 관리자에게 문의해 주세요
